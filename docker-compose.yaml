services:
  postgres:
    image: postgres:17
    container_name: shopping-platform
    environment:
      POSTGRES_DB: shopping_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: project-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data: